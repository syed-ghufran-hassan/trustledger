[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
trustledger_solana = "E6iVUfnGNReT7RpueSs94yCX5S2Ua1mdh3FefD6HXZam"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""

[test.validator]
rpc_port = 8899
bind_address = "127.0.0.1"
ledger = ".anchor/test-ledger"
